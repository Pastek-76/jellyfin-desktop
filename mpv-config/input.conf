# Raccourcis mpv propres à Jellyfin Desktop (les autres raccourcis par défaut de mpv restent actifs).
# Plein écran : c'est la fenêtre de l'application qui passe en plein écran.
f               script-message jfd-fullscreen
MBTN_LEFT_DBL   script-message jfd-fullscreen
# Échap : quitte le plein écran, ou arrête la lecture si la fenêtre n'est pas en plein écran.
ESC             script-message jfd-escape
# Arrêter la lecture et revenir à Jellyfin.
q               stop
Q               stop
# Épisode / piste suivant(e) et précédent(e) dans la file Jellyfin.
>               script-message jfd-next
<               script-message jfd-previous
NEXT            script-message jfd-next
PREV            script-message jfd-previous
