# Configuration mpv de Jellyfin Desktop.
# Interface : barre de contrôle mpv en bas, masquée automatiquement.
osc=yes
osd-bar=yes
# Langue des pistes par défaut (Jellyfin choisit déjà les pistes, ceci n'est qu'un repli).
alang=fre,fra,fr,eng,en
slang=fre,fra,fr
# Qualité : décodage matériel quand il est sûr, sinon logiciel.
hwdec=auto-safe
profile=high-quality
# Sous-titres ASS/SSA rendus avec leur style d'origine.
sub-ass-override=no
# Captures d'écran (touche s) sur le Bureau.
screenshot-directory=~~desktop/
