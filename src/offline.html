<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Jellyfin — Serveur injoignable</title>
  <style>
    :root { --bg:#101010; --card:#1c1c1e; --border:#2e2e33; --text:#f2f2f2; --muted:#9a9aa2; --accent:#00a4dc; --accent2:#aa5cc3; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 20% -10%, rgba(170,92,195,.18), transparent 60%),
                  radial-gradient(1000px 600px at 110% 110%, rgba(0,164,220,.16), transparent 60%), var(--bg);
      color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 32px 16px; text-align: center;
    }
    main { max-width: 460px; width: 100%; }
    .ring { width: 72px; height: 72px; margin: 0 auto 20px; position: relative; }
    .ring svg { width: 72px; height: 72px; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 5; }
    .ring .track { stroke: var(--border); }
    .ring .bar { stroke: url(#g); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .ring .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 600; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(270deg); } }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 6px; }
    .detail { font-size: 13px; color: #7d7d85; min-height: 20px; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    button { font: inherit; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
    .primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); border: none; color: #fff; font-weight: 600; }
    .secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .secondary:hover { border-color: var(--muted); }
    button:disabled { opacity: .6; cursor: progress; }
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 72 72">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aa5cc3"/><stop offset="1" stop-color="#00a4dc"/></linearGradient></defs>
        <circle class="track" cx="36" cy="36" r="31"/>
        <circle id="bar" class="bar" cx="36" cy="36" r="31" stroke-dasharray="194.8" stroke-dashoffset="0"/>
      </svg>
      <div id="count" class="count"></div>
    </div>
    <h1 id="title">Serveur injoignable</h1>
    <p id="status">Nouvelle tentative dans quelques secondes…</p>
    <p id="detail" class="detail"></p>
    <div class="actions">
      <button id="retry" class="primary" type="button">Réessayer maintenant</button>
      <button id="change" class="secondary" type="button">Changer de serveur</button>
    </div>
  </main>
  <script src="offline.js"></script>
</body>
</html>
